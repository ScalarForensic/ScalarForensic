name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format check (ruff)
        run: uv run ruff format --check src tests scripts

      - name: Run tests
        run: uv run pytest

  # The review-only exclusion guarantee (vectorless points stay out of
  # similarity search) can only be observed against a real Qdrant; the
  # hermetic suite skips these tests. Kept as a separate job so the fast
  # suite stays fast.
  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz; then exit 0; fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      # --no-cov: the global --cov-fail-under=65 in pyproject addopts is a floor
      # for the *full* suite. This job runs a 5-test subset on purpose, so
      # coverage lands near 2% and the floor fails a job whose tests all passed.
      - name: Run Qdrant-gated integration tests
        env:
          SFN_TEST_QDRANT_URL: http://localhost:6333
        run: uv run pytest tests/faces/test_store_integration.py -v --no-cov
