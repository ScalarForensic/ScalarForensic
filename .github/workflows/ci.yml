name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN: both jobs only ever check out
# the repo. Declared at the top level so a new job cannot silently inherit the
# permissive default.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      # ffmpeg is a declared external dependency, not a convenience
      # (docs/specs/video-playback-transcode.md §8): the transcode path shells
      # out to the binary, and its libzimg-backed zscale/tonemap filters are
      # what make an HDR viewing copy carry bt709 instead of an 8-bit picture
      # still labelled bt2020.  Without this step every encode test skips and
      # the job goes green on tests that never ran.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Format check (ruff)
        run: uv run ruff format --check src tests scripts

      # The JS suite is a STEP in this job and deliberately not a job of its
      # own. `main` is gated by a repository ruleset whose required checks are
      # exactly `lint-and-test (3.12)` and `qdrant-integration`; a third job
      # would not be required, so it could be red and still merge — a
      # decorative check is worse than none, because it looks like coverage.
      # As a step it is required by construction and needs no ruleset change.
      #
      # There is no `npm ci` because there is nothing to install: the harness
      # runs on Node's built-in test runner and `package.json` declares no
      # dependencies (see tests/js/harness.mjs for why).
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"

      # Before the Python suite: it takes seconds, and it is the only check
      # that can tell a browser script apart from a text file that looks like
      # one. `player.js` once shipped a SyntaxError past 14 green wiring tests.
      - name: Run JS tests (node --test)
        run: npm test

      - name: Run tests
        run: uv run pytest

  # The review-only exclusion guarantee (vectorless points stay out of
  # similarity search) can only be observed against a real Qdrant; the
  # hermetic suite skips these tests. Kept as a separate job so the fast
  # suite stays fast.
  qdrant-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz; then exit 0; fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      # No ffmpeg install here on purpose: this job runs only
      # tests/faces/test_store_integration.py, which touches no video path. If
      # this job's test selection ever widens to the video suite, it needs the
      # `Install ffmpeg` step from lint-and-test — the encode tests fail rather
      # than skip when ffmpeg is absent under CI, so it will say so loudly.
      #
      # --no-cov: the global --cov-fail-under=65 in pyproject addopts is a floor
      # for the *full* suite. This job runs a 5-test subset on purpose, so
      # coverage lands near 2% and the floor fails a job whose tests all passed.
      - name: Run Qdrant-gated integration tests
        env:
          SFN_TEST_QDRANT_URL: http://localhost:6333
        run: uv run pytest tests/faces/test_store_integration.py -v --no-cov
